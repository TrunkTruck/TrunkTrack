<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบการสั่น</title>
<style>
  body{font-family:sans-serif;text-align:center;padding:24px}
  button{display:block;width:100%;max-width:320px;margin:12px auto;padding:16px;font-size:18px;border:0;border-radius:10px;color:#fff}
  .a{background:#2e7d32}.b{background:#c62828}.c{background:#555}
</style>
</head>
<body>
<h2>ทดสอบการสั่น</h2>
<p id="s"></p>
<button class="a" onclick="navigator.vibrate(200)">สั่นแบบระวัง</button>
<button class="b" onclick="navigator.vibrate([400,100,400,100,400])">สั่นแบบเสี่ยงสูง</button>
<button class="c" onclick="navigator.vibrate(0)">หยุดสั่น</button>
<script>
  document.getElementById('s').textContent =
    'รองรับการสั่น: ' + ('vibrate' in navigator ? 'ใช่' : 'ไม่');
</script>
</body>
</html>
