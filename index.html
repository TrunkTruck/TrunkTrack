<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrunkTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#17302b;--mu:#6b7f7a;--bd:#e3ebe8;--g:#22b07d;--y:#f5a524;--o:#f97316;--r:#e5484d;--c:var(--g)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18221f;--tx:#e8f2ef;--mu:#8aa09a;--bd:#263431}}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px}h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--bd);color:var(--mu)}
.chip.on{background:#d9f5ea;color:#0b7a53}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.gauge{position:relative;width:200px;height:200px;margin:4px auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:46px;font-weight:700;color:var(--c);line-height:1}
.dir{font-size:15px;margin-top:4px;color:var(--c);font-weight:500}
.status{text-align:center;font-size:14px;color:var(--mu);margin-top:6px}
.row{display:flex;gap:8px;margin-top:12px}
.row>div{flex:1;text-align:center;background:var(--bg);border-radius:14px;padding:10px 4px}
.row b{display:block;font-size:20px}.row span{font-size:11px;color:var(--mu)}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:var(--g);color:#fff;font-weight:500;cursor:pointer;width:100%}
button.sec{background:var(--bd);color:var(--tx)}
.btns{display:flex;gap:8px;margin-top:10px}
h2{font-size:15px;margin-bottom:8px}
.ev{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.ev:first-of-type{border-top:0}.ev small{color:var(--mu);display:block;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tabs{display:flex;background:var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{background:none;color:var(--mu);padding:8px}.tabs button.a{background:var(--card);color:var(--tx)}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;display:flex;justify-content:space-between;font-size:14px}
input[type=text]{width:100%;font:inherit;font-size:12px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 8px}
label{font-size:12px;color:var(--mu)}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:10px}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);max-width:456px;margin:auto;background:#17302b;color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;transform:translateY(-140%);transition:transform .3s;z-index:9;box-shadow:0 8px 24px #0004}
#toast.s{transform:none}#toast b{display:block}
.hide{display:none}
</style>
</head>
<body>
<div id="toast"><b id="tt"></b><span id="tb"></span></div>
<main>
<header><h1>TrunkTrack<small>สายรัดหลังส่วนล่าง · เฝ้าระวังท่าทาง</small></h1><span class="chip" id="conn">ยังไม่เชื่อมต่อ</span></header>

<div class="tabs"><button class="a" data-t="home">วันนี้</button><button data-t="hist">ประวัติ 30 วัน</button><button data-t="set">ตั้งค่า</button></div>

<section id="home">
  <div class="card">
    <div class="gauge">
      <svg width="200" height="200" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--c)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset .25s"/></svg>
      <div class="mid"><div class="big"><span id="ang">0</span>°</div><div class="dir" id="dir">ท่าปกติ</div></div>
    </div>
    <div class="status" id="status">กดเชื่อมต่อเพื่อเริ่มติดตาม</div>
    <div class="row"><div><b id="pv">0.0°</b><span>ก้ม/เงย (Pitch)</span></div><div><b id="rv">0.0°</b><span>เอียง (Roll)</span></div></div>
    <div class="btns"><button id="btnConn">เชื่อมต่อบลูทูธ</button><button class="sec" id="btnCal" style="width:auto;white-space:nowrap">ตั้งท่าตรง</button></div>
  </div>
  <div class="card"><h2>สรุปวันนี้</h2>
    <div class="row" style="margin-top:0"><div><b id="sCount">0</b><span>จำนวนครั้ง</span></div><div><b id="sTime">0 วิ</b><span>เวลารวม</span></div><div><b id="sMax">0°</b><span>มุมสูงสุด</span></div></div>
  </div>
  <div class="card"><h2>เหตุการณ์วันนี้</h2><div id="todayList"></div></div>
</section>

<section id="hist" class="hide"><div class="card"><h2>ย้อนหลัง 1 เดือน</h2><div id="histList"></div></div></section>

<section id="set" class="hide">
  <div class="card"><h2>การเชื่อมต่อ (BLE ของ ESP32)</h2>
    <label>Service UUID</label><input type="text" id="uSvc">
    <label>Characteristic UUID (แบบ Notify)</label><input type="text" id="uChr">
    <button class="sec" id="btnSave">บันทึก UUID</button>
  </div>
  <div class="card"><h2>โหมดทดสอบ (ไม่ต้องมีอุปกรณ์)</h2>
    <label>ก้ม/เงย (Pitch): <span id="dpv">0</span>°</label><input type="range" id="dp" min="-90" max="90" value="0" style="width:100%">
    <label>เอียง (Roll): <span id="drv">0</span>°</label><input type="range" id="dr" min="-90" max="90" value="0" style="width:100%">
    <button class="sec" id="btnDemo" style="margin-top:8px">เริ่มโหมดทดสอบ</button>
  </div>
  <div class="card"><button class="sec" id="btnClear">ล้างประวัติทั้งหมด</button></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const LV = [{n:'ปกติ',c:'#22b07d',v:0},{n:'เบา',c:'#f5a524',v:1000},{n:'ปานกลาง',c:'#f97316',v:3000},{n:'รุนแรง',c:'#e5484d',v:5000}];
const DEF = {svc:'6e400001-b5a3-f393-e0a9-e50e24dcca9e', chr:'6e400003-b5a3-f393-e0a9-e50e24dcca9e'};
const S = {on:false, demo:false, dev:null, p:0, r:0, off:{p:0,r:0}, alerted:0, ev:null, events:[], raw:{p:0,r:0}, buf:'', timer:null};
const ls = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- เก็บข้อมูล 30 วัน ---------- */
function load(){ const lim = Date.now()-30*864e5; S.events = ls.get('tt_events',[]).filter(e=>e.t>=lim); S.off = ls.get('tt_off',S.off); }
function save(){ S.events = S.events.filter(e=>e.t>=Date.now()-30*864e5); ls.set('tt_events',S.events); }
const dayKey = t => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hm = t => new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
const fd = s => s<60 ? s+' วิ' : Math.floor(s/60)+' นาที '+(s%60)+' วิ';

/* ---------- แจ้งเตือน ---------- */
let tmo;
function toast(t,b=''){ $('tt').textContent=t; $('tb').textContent=b; $('toast').classList.add('s'); clearTimeout(tmo); tmo=setTimeout(()=>$('toast').classList.remove('s'),4000); }
async function popup(title,body){
  toast(title,body);
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if(reg) reg.showNotification(title,{body,tag:'trunktrack',renotify:true,icon:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#22b07d"/><text x="32" y="43" font-size="30" text-anchor="middle" fill="#fff">T</text></svg>')});
    else new Notification(title,{body,tag:'trunktrack'});
  }catch(e){}
}
function alertUser(lvl,dir,ang){
  if(navigator.vibrate) navigator.vibrate(LV[lvl].v);
  popup('⚠️ ท่าทางไม่เหมาะสม ('+LV[lvl].n+')', dir+' '+ang.toFixed(0)+'° — ปรับหลังให้ตรง');
}

/* ---------- ประมวลผลข้อมูลมุม ---------- */
function direction(p,r){
  if(Math.abs(p)>=Math.abs(r)) return p>0 ? 'ก้มหน้า' : 'แหงนหลัง';
  return r>0 ? 'เอียงขวา' : 'เอียงซ้าย';
}
function process(rawP,rawR){
  S.raw={p:rawP,r:rawR};
  const p = rawP-S.off.p, r = rawR-S.off.r, ang = Math.max(Math.abs(p),Math.abs(r));
  S.p=p; S.r=r;
  const lvl = ang>60?3 : ang>20?2 : ang>(S.ev?4:5)?1 : 0;   // hysteresis กันค่ากระเพื่อม
  const dir = direction(p,r), now = Date.now();
  if(lvl===0){ if(S.ev) closeEvent(); S.alerted=0; }
  else if(!S.ev){                                           // เริ่มทำผิดครั้งแรก → เตือน
    S.ev={t:now,dur:0,max:ang,dir,lvl};
    S.alerted=lvl; alertUser(lvl,dir,ang);
  } else {                                                  // ค้างอยู่ → เงียบ (เตือนซ้ำเฉพาะเมื่อรุนแรงขึ้นกว่าเดิม)
    if(ang>S.ev.max){S.ev.max=ang;S.ev.dir=dir;}
    if(lvl>S.alerted){S.alerted=lvl;S.ev.lvl=lvl;alertUser(lvl,dir,ang);}
  }
  paint(ang,lvl,dir);
}
function closeEvent(){
  if(!S.ev) return;
  S.ev.dur = Math.max(1,Math.round((Date.now()-S.ev.t)/1000));
  S.events.push({...S.ev, max:Math.round(S.ev.max)}); S.ev=null; save(); renderStats();
}

/* ---------- แสดงผล ---------- */
function paint(ang,lvl,dir){
  const c = LV[lvl].c; document.documentElement.style.setProperty('--c',c);
  $('ang').textContent = ang.toFixed(0);
  $('ring').style.strokeDashoffset = 326.7*(1-Math.min(ang,90)/90);
  $('dir').textContent = lvl ? dir+' · '+LV[lvl].n : 'ท่าปกติ';
  $('pv').textContent = S.p.toFixed(1)+'°'; $('rv').textContent = S.r.toFixed(1)+'°';
  $('status').textContent = lvl ? 'กำลังทำผิดท่า '+fd(Math.round((Date.now()-S.ev.t)/1000)) : (S.on||S.demo ? 'ท่าทางดี 👍' : 'กดเชื่อมต่อเพื่อเริ่มติดตาม');
}
function evRow(e){ return `<div class="ev"><div><span class="dot" style="background:${LV[e.lvl].c}"></span>${hm(e.t)} น. · ${e.dir}<small>มุมสูงสุด ${e.max}°</small></div><b>${fd(e.dur)}</b></div>`; }
function renderStats(){
  const k = dayKey(Date.now()), td = S.events.filter(e=>dayKey(e.t)===k);
  $('sCount').textContent = td.length;
  $('sTime').textContent = fd(td.reduce((a,e)=>a+e.dur,0));
  $('sMax').textContent = Math.max(0,...td.map(e=>e.max))+'°';
  $('todayList').innerHTML = td.length ? td.slice().reverse().map(evRow).join('') : '<div class="empty">ยังไม่มีการทำผิดท่าวันนี้ 🎉</div>';
  const days = {}; S.events.forEach(e=>(days[dayKey(e.t)]??=[]).push(e));
  const keys = Object.keys(days).sort().reverse();
  $('histList').innerHTML = keys.length ? keys.map(d=>{
    const a=days[d], tot=a.reduce((x,e)=>x+e.dur,0);
    return `<details><summary><span>${new Date(d+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}</span><span>${a.length} ครั้ง · ${fd(tot)}</span></summary>${a.slice().reverse().map(evRow).join('')}</details>`;
  }).join('') : '<div class="empty">ยังไม่มีข้อมูลย้อนหลัง</div>';
}

/* ---------- แปลงข้อมูลจาก ESP32 ---------- */
// รองรับ: "pitch,roll" | "P:12.5,R:-3" | JSON {"pitch":..,"roll":..} | ขึ้นบรรทัดใหม่ท้ายข้อความ
function parse(txt){
  txt = txt.trim(); if(!txt) return null;
  try{ const j=JSON.parse(txt); if(j&&typeof j==='object'){ const p=j.pitch??j.p??j.y??j.x, r=j.roll??j.r??j.z; if(isFinite(p)) return [+p,+(r||0)]; } }catch{}
  const m = txt.match(/-?\d+(?:\.\d+)?/g); if(!m) return null;
  return [parseFloat(m[0]), m[1]!==undefined?parseFloat(m[1]):0];
}
function onData(e){
  if(!S.on) return;                                         // ป้องกันแอปค้างถ้าบลูทูธยังไม่พร้อม
  S.buf += new TextDecoder().decode(e.target.value);
  const lines = S.buf.split(/\r?\n/); S.buf = lines.pop();
  lines.forEach(l=>{const v=parse(l); if(v) process(v[0],v[1]);});
  if(S.buf){ const v=parse(S.buf); if(v && /\d\s*$/.test(S.buf) && S.buf.length>3){ S.buf=''; process(v[0],v[1]); } }
  if(S.buf.length>200) S.buf='';
}

/* ---------- บลูทูธ ---------- */
function setConn(on,name=''){
  S.on=on; $('conn').textContent = on ? 'เชื่อมต่อ '+(name||'แล้ว') : 'ยังไม่เชื่อมต่อ'; $('conn').classList.toggle('on',on);
  $('btnConn').textContent = on ? 'ตัดการเชื่อมต่อ' : 'เชื่อมต่อบลูทูธ';
  clearInterval(S.timer); S.timer=null;
  if(on) S.timer=setInterval(()=>{ if(S.on||S.demo) process(S.raw.p,S.raw.r); },1000);  // นาฬิกาทำงานเฉพาะตอนเชื่อมต่อสำเร็จ
  else if(!S.demo){ closeEvent(); paint(0,0,''); }
}
async function connect(){
  if(S.on){ S.dev?.gatt?.connected && S.dev.gatt.disconnect(); setConn(false); return; }
  if(!navigator.bluetooth){ toast('เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth','ใช้ Chrome บน Android หรือคอมพิวเตอร์ (iPhone ไม่รองรับ)'); return; }
  if('Notification' in window && Notification.permission==='default') await Notification.requestPermission();
  try{
    const svc=$('uSvc').value.trim().toLowerCase(), chr=$('uChr').value.trim().toLowerCase();
    S.dev = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:[svc]});
    S.dev.addEventListener('gattserverdisconnected',()=>{ if(S.on){ setConn(false); toast('การเชื่อมต่อหลุด','กดเชื่อมต่อใหม่อีกครั้ง'); } });
    $('status').textContent='กำลังเชื่อมต่อ...';
    const srv = await S.dev.gatt.connect();
    const c = await (await srv.getPrimaryService(svc)).getCharacteristic(chr);
    await c.startNotifications(); c.addEventListener('characteristicvaluechanged',onData);
    S.buf=''; setConn(true,S.dev.name||''); toast('เชื่อมต่อสำเร็จ','กำลังรับข้อมูลจากสายรัด');
  }catch(e){ setConn(false); if(e.name!=='NotFoundError') toast('เชื่อมต่อไม่สำเร็จ',e.message); else $('status').textContent='ยกเลิกการเชื่อมต่อ'; }
}

/* ---------- UI ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('a',x===b));
  ['home','hist','set'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.t));
});
$('btnConn').onclick=connect;
$('btnCal').onclick=()=>{ S.off={p:S.raw.p,r:S.raw.r}; ls.set('tt_off',S.off); process(S.raw.p,S.raw.r); toast('ตั้งค่าท่าตรงแล้ว','ใช้ท่าปัจจุบันเป็น 0°'); };
$('btnSave').onclick=()=>{ ls.set('tt_uuid',{svc:$('uSvc').value.trim(),chr:$('uChr').value.trim()}); toast('บันทึกแล้ว'); };
$('btnClear').onclick=()=>{ if(confirm('ล้างประวัติทั้งหมด?')){ S.events=[]; save(); renderStats(); } };
const demoIn=()=>{ $('dpv').textContent=$('dp').value; $('drv').textContent=$('dr').value; if(S.demo) process(+$('dp').value,+$('dr').value); };
$('dp').oninput=$('dr').oninput=demoIn;
$('btnDemo').onclick=async()=>{
  S.demo=!S.demo; $('btnDemo').textContent=S.demo?'หยุดโหมดทดสอบ':'เริ่มโหมดทดสอบ';
  if(S.demo){ if('Notification' in window && Notification.permission==='default') await Notification.requestPermission();
    if(!S.timer) S.timer=setInterval(()=>{ if(S.on||S.demo) process(S.raw.p,S.raw.r); },1000); demoIn(); }
  else if(!S.on){ clearInterval(S.timer); S.timer=null; closeEvent(); paint(0,0,''); }
};

load();
const u = ls.get('tt_uuid',DEF); $('uSvc').value=u.svc; $('uChr').value=u.chr;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeunload',closeEvent);
renderStats(); paint(0,0,'');
</script>
</body>
</html>
